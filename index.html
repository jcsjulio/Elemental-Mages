<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<script>
  const socket = io('https://elemental-mages.onrender.com');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let players = {};
  let monsters = {};
  let myId = null;

  // Posição local imediata para zero lag no jogador
  let myPos = { x: 400, y: 300 };
  const speed = 5;
  const keys = {};

  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const targetX = e.clientX - rect.left;
    const targetY = e.clientY - rect.top;

    socket.emit('castSpell', {
      startX: myPos.x,
      startY: myPos.y,
      targetX: targetX,
      targetY: targetY
    });
  });

  // Eventos de Conexão
  socket.on('connect', () => { myId = socket.id; });
  
  socket.on('currentPlayers', (serverPlayers) => { 
    players = serverPlayers;
    if (players[myId]) {
      myPos.x = players[myId].x;
      myPos.y = players[myId].y;
    }
  });

  socket.on('newPlayer', (p) => { players[p.id] = p; });
  
  socket.on('playerMoved', (p) => { 
    if (players[p.id] && p.id !== myId) {
      players[p.id].x = p.x;
      players[p.id].y = p.y;
    } 
  });

  socket.on('playerDisconnected', (id) => { delete players[id]; });

  socket.on('currentMonsters', (list) => { list.forEach(m => monsters[m.id] = m); });
  socket.on('spawnMonster', (m) => { monsters[m.id] = m; });
  socket.on('monsterHit', (data) => { if(monsters[data.id]) monsters[data.id].hp = data.hp; });
  socket.on('monsterDestroyed', (id) => { delete monsters[id]; });

  let spells = [];
  socket.on('spellCast', (spell) => {
    spells.push({ ...spell, life: 10 });
  });

  socket.on('chatMessage', (data) => {
    const msgDiv = document.getElementById('chat-messages');
    msgDiv.innerHTML += `<div><strong>${data.sender} (${data.element}):</strong> ${data.text}</div>`;
    msgDiv.scrollTop = msgDiv.scrollHeight;
  });

  function sendMessage() {
    const input = document.getElementById('chat-input');
    if(input.value.trim() !== '') {
      socket.emit('chatMessage', input.value);
      input.value = '';
    }
  }

  // Loop de Movimentação Local (Super Fluido)
  let lastEmit = 0;
  function update() {
    let moved = false;
    if (keys['w'] || keys['arrowup']) { myPos.y -= speed; moved = true; }
    if (keys['s'] || keys['arrowdown']) { myPos.y += speed; moved = true; }
    if (keys['a'] || keys['arrowleft']) { myPos.x -= speed; moved = true; }
    if (keys['d'] || keys['arrowright']) { myPos.x += speed; moved = true; }

    // Limita o mago dentro das bordas da arena
    myPos.x = Math.max(20, Math.min(canvas.width - 20, myPos.x));
    myPos.y = Math.max(20, Math.min(canvas.height - 20, myPos.y));

    if (players[myId]) {
      players[myId].x = myPos.x;
      players[myId].y = myPos.y;
    }

    // Transmite posição para o servidor em intervalos curtos (evita spam na rede)
    const now = Date.now();
    if (moved && now - lastEmit > 30) { // ~30 envios por segundo
      socket.emit('playerMove', myPos);
      lastEmit = now;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Círculo Rúnico
    ctx.strokeStyle = 'rgba(107, 59, 167, 0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(400, 300, 220, 0, Math.PI * 2);
    ctx.stroke();

    // Desenha Magos
    Object.values(players).forEach(p => {
      ctx.fillStyle = p.color || '#fff';
      ctx.shadowColor = p.color || '#fff';
      ctx.shadowBlur = 12;

      ctx.beginPath();
      ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.font = '12px Georgia';
      ctx.shadowBlur = 0;
      ctx.fillText(`${p.name} [${p.element}]`, p.x - 35, p.y - 25);
    });

    // Desenha Monstros
    Object.values(monsters).forEach(m => {
      ctx.fillStyle = '#4a3b52';
      ctx.strokeStyle = '#8b0000';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 8;

      ctx.beginPath();
      ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#222';
      ctx.fillRect(m.x - 20, m.y - 35, 40, 5);
      ctx.fillStyle = '#ff2255';
      ctx.fillRect(m.x - 20, m.y - 35, (m.hp / m.maxHp) * 40, 5);
    });

    // Feitiços
    spells.forEach((s, index) => {
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 4;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 10;

      ctx.beginPath();
      ctx.moveTo(s.startX, s.startY);
      ctx.lineTo(s.targetX, s.targetY);
      ctx.stroke();

      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.targetX, s.targetY, 8, 0, Math.PI * 2);
      ctx.fill();

      s.life -= 1;
      if(s.life <= 0) spells.splice(index, 1);
    });

    ctx.shadowBlur = 0;
    update();
    requestAnimationFrame(draw);
  }

  draw();
</script>
