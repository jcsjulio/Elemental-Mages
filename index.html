<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Elemental Mages: Arena Co-Op 🔮</title>
  <style>
    body {
      background: #0d0914;
      color: #e2d1f9;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      gap: 20px;
    }
    #game-container {
      position: relative;
    }
    canvas {
      border: 3px solid #6b3ba7;
      background: #140d21;
      box-shadow: 0 0 25px rgba(107, 59, 167, 0.4);
      cursor: crosshair;
    }
    #chat-box {
      width: 290px;
      height: 600px;
      background: #140d21;
      border: 3px solid #6b3ba7;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 25px rgba(107, 59, 167, 0.4);
      border-radius: 4px;
    }
    #chat-title {
      padding: 12px;
      background: #6b3ba7;
      color: #fff;
      font-weight: bold;
      text-align: center;
      letter-spacing: 1px;
    }
    #chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      font-size: 0.9rem;
      font-family: monospace;
    }
    #chat-input-container {
      display: flex;
      border-top: 2px solid #6b3ba7;
    }
    #chat-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      padding: 10px;
      outline: none;
      font-family: monospace;
    }
    #send-btn {
      background: #6b3ba7;
      color: #fff;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>

  <div id="chat-box">
    <div id="chat-title">🔮 GRIMÓRIO DA GUILDA</div>
    <div id="chat-messages"></div>
    <div id="chat-input-container">
      <input type="text" id="chat-input" placeholder="Conjurar mensagem..." />
      <button id="send-btn" onclick="sendMessage()">ENVIAR</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let players = {};
    let monsters = {};
    let myId = null;

    let myPos = { x: 400, y: 300 };
    const speed = 4;
    const keys = {};

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const targetX = e.clientX - rect.left;
      const targetY = e.clientY - rect.top;

      socket.emit('castSpell', {
        startX: myPos.x,
        startY: myPos.y,
        targetX: targetX,
        targetY: targetY
      });
    });

    // Eventos Sincronizados
    socket.on('connect', () => { myId = socket.id; });
    socket.on('currentPlayers', (serverPlayers) => { players = serverPlayers; });
    socket.on('newPlayer', (p) => { players[p.id] = p; });
    socket.on('playerMoved', (p) => { if(players[p.id]) players[p.id] = p; });
    socket.on('playerDisconnected', (id) => { delete players[id]; });

    socket.on('currentMonsters', (list) => { list.forEach(m => monsters[m.id] = m); });
    socket.on('spawnMonster', (m) => { monsters[m.id] = m; });
    socket.on('monsterHit', (data) => { if(monsters[data.id]) monsters[data.id].hp = data.hp; });
    socket.on('monsterDestroyed', (id) => { delete monsters[id]; });

    // Animação de Feitiço Conjurado
    let spells = [];
    socket.on('spellCast', (spell) => {
      spells.push({ ...spell, life: 12 });
    });

    // Chat
    socket.on('chatMessage', (data) => {
      const msgDiv = document.getElementById('chat-messages');
      msgDiv.innerHTML += `<div><strong>${data.sender} (${data.element}):</strong> ${data.text}</div>`;
      msgDiv.scrollTop = msgDiv.scrollHeight;
    });

    function sendMessage() {
      const input = document.getElementById('chat-input');
      if(input.value.trim() !== '') {
        socket.emit('chatMessage', input.value);
        input.value = '';
      }
    }

    function update() {
      let moved = false;
      if (keys['w'] || keys['arrowup']) { myPos.y -= speed; moved = true; }
      if (keys['s'] || keys['arrowdown']) { myPos.y += speed; moved = true; }
      if (keys['a'] || keys['arrowleft']) { myPos.x -= speed; moved = true; }
      if (keys['d'] || keys['arrowright']) { myPos.x += speed; moved = true; }

      if (moved) {
        socket.emit('playerMove', myPos);
        if(players[myId]) {
          players[myId].x = myPos.x;
          players[myId].y = myPos.y;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Círculo Rúnico no Fundo
      ctx.strokeStyle = 'rgba(107, 59, 167, 0.15)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(400, 300, 220, 0, Math.PI * 2);
      ctx.stroke();

      // Desenha Magos (Jogadores)
      Object.values(players).forEach(p => {
        // Aura Mágica
        ctx.fillStyle = p.color || '#fff';
        ctx.shadowColor = p.color || '#fff';
        ctx.shadowBlur = 15;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
        ctx.fill();

        // Nome e Elemento
        ctx.fillStyle = '#fff';
        ctx.font = '12px Georgia';
        ctx.shadowBlur = 0;
        ctx.fillText(`${p.name} [${p.element}]`, p.x - 35, p.y - 25);
      });

      // Desenha Golens / Monstros
      Object.values(monsters).forEach(m => {
        ctx.fillStyle = '#4a3b52';
        ctx.strokeStyle = '#8b0000';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 8;

        ctx.beginPath();
        ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Barra de Vida
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#222';
        ctx.fillRect(m.x - 20, m.y - 35, 40, 5);
        ctx.fillStyle = '#ff2255';
        ctx.fillRect(m.x - 20, m.y - 35, (m.hp / m.maxHp) * 40, 5);
      });

      // Desenha Orbes Mágicas / Explosões de Feitiço
      spells.forEach((s, index) => {
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 4;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.moveTo(s.startX, s.startY);
        ctx.lineTo(s.targetX, s.targetY);
        ctx.stroke();

        // Impacto na ponta do feitiço
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.targetX, s.targetY, 10, 0, Math.PI * 2);
        ctx.fill();

        s.life -= 1;
        if(s.life <= 0) spells.splice(index, 1);
      });

      ctx.shadowBlur = 0;
      update();
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
